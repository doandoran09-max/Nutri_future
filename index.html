  <script>
    (function () {
      var theme = 'light', realm = '';
      try {
        theme = localStorage.getItem('nf_theme') || 'light';
        realm = localStorage.getItem('nf_realm') || '';   // giao diện theo cấp (js/game-enhancements.js) — áp dụng ngay để không bị chớp
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
      if (/^[a-z]+$/.test(realm)) document.documentElement.setAttribute('data-nf-realm', realm);
    })();
  </script>

<body>

  <!-- Liên kết tĩnh, có sẵn trong HTML gốc (không cần chạy JS) để crawler/agent
       tìm thấy tài liệu & mã nguồn — ẩn khỏi màn hình nhưng vẫn đọc được bởi
       trình đọc màn hình (dùng lại .sr-only hiện có, không đổi layout hiển thị). -->
  <nav class="sr-only" aria-label="Thêm thông tin về NutriFuture">
    <a href="about.html">Giới thiệu NutriFuture</a>
    <a href="contact.html">Liên hệ</a>
    <a href="privacy.html">Quyền riêng tư &amp; Dữ liệu</a>
    <a href="https://github.com/doandoran09-max/Nutri_future">Mã nguồn trên GitHub</a>
  </nav>

  <header id="app-header">
    <div class="header-inner">
      <div class="logo" onclick="location.hash='#home'" title="Về trang chủ">
        <div class="logo__icon">
          <i class="fa-solid fa-bowl-food"></i>
        </div>
        <div class="logo__text">Nutri<span>Future</span></div>
      </div>

      <div class="header-actions">
        <button id="btn-theme-toggle" class="header-date" title="Chuyển giao diện sáng/tối" aria-label="Chuyển giao diện sáng/tối">
          <i class="fa-solid fa-moon" id="theme-toggle-icon"></i>
        </button>
        <a href="#history" class="header-date" title="Xem lịch sử &amp; báo cáo" aria-label="Xem lịch sử &amp; báo cáo">
          <i class="fa-solid fa-chart-column"></i>
          <span>Báo cáo</span>
        </a>
        <a href="#profile" class="header-date" title="Hồ sơ cá nhân" aria-label="Hồ sơ cá nhân">
          <i class="fa-solid fa-user-gear"></i>
        </a>
      </div>
    </div>
  </header>

  <main id="app-content" role="main">
    <div class="loading-container">
      <div class="loading-spinner"></div>
      <p class="loading-text">Đang khởi chạy NutriFuture AI...</p>
    </div>
  </main>

  <nav id="bottom-nav" aria-label="Điều hướng chính">
    <button class="nav-btn active" data-target="#home" title="Trang chủ">
      <i class="fa-solid fa-house"></i>
      <span>Trang chủ</span>
    </button>
    <button class="nav-btn" data-target="#lookup" title="Tra cứu">
      <i class="fa-solid fa-magnifying-glass"></i>
      <span>Tra cứu</span>
    </button>
    <button class="nav-btn nav-btn--camera" data-target="#camera" title="Camera AI">
      <div class="nav-btn__icon-wrap"><i class="fa-solid fa-camera"></i></div>
      <span>Camera AI</span>
    </button>
    <button class="nav-btn" data-target="#diary" title="Nhật ký">
      <i class="fa-solid fa-book-open"></i>
      <span>Nhật ký</span>
    </button>
    <button class="nav-btn" data-target="#game" title="Học mà chơi">
      <i class="fa-solid fa-gamepad"></i>
      <span>Game</span>
    </button>
  </nav>

  <div id="toast" class="toast" role="alert" aria-live="polite"></div>
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-content" id="modal-content"></div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => {
          console.warn('[SW] Đăng ký thất bại:', err);
        });
      });
    }
  </script>
